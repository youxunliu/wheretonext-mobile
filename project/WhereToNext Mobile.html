const SCHENGEN = new Set(['AT','BE','CZ','DK','EE','FI','FR','DE','GR','HU','IS','IT','LV','LT','LU','MT','NL','NO','PL','PT','SK','SI','ES','SE','CH']);

// expired? expiry is YYYY-MM-DD or null. null = no expiry / treat as valid
const isExpired = (expiry) => {
  if (!expiry) return false;
  const d = new Date(expiry + 'T00:00:00');
  return d.getTime() < Date.now();
};

function computeAccess(passports, residence, residenceExpiry, visas) {
  // passports: string[] of codes
  // visas: [{code, expiry}]
  const tiers = (passports || []).map(p => PASSPORTS.find(x=>x.code===p)?.tier || 4);
  const bestTier = tiers.length ? Math.min(...tiers) : 4;

  // effective visa set, honouring expiry
  const eff = new Set();
  (visas || []).forEach(v => { if (!isExpired(v.expiry)) eff.add(v.code); });
  if (residence && !isExpired(residenceExpiry)) {
    const r = RESIDENCE.find(x=>x.code===residence);
    if (r?.schengen || SCHENGEN.has(residence)) eff.add('schengen');
    if (residence==='US') eff.add('us');
    if (residence==='GB') eff.add('uk');
    if (residence==='CA') eff.add('ca');
    if (residence==='AE') eff.add('ae');
  }

  // rank access: vf best, then voa/ev, then vr; longer days wins within type
  const rank = (a) => {
    if (!a || a.type==='vr') return -1;
    const base = a.type==='vf' ? 3000 : a.type==='voa' ? 2000 : a.type==='ev' ? 1000 : 0;
    return base + (a.days || 0);
  };

  return DEST.map(d => {
    if (passports && passports.includes(d.c)) return null;

    // pick best passport tier result for this destination
    let bestAccess = null;
    let bestPassport = null;
    (passports && passports.length ? passports : [null]).forEach(pc => {
      const t = PASSPORTS.find(x=>x.code===pc)?.tier || 4;
      const ta = d.ti[t-1];
      if (rank(ta) > rank(bestAccess)) { bestAccess = ta; bestPassport = pc; }
    });

    const via = d.u.find(v => eff.has(v));
    if (bestAccess && bestAccess.type !== 'vr') {
      return {...d, access: bestAccess, surprise: false, viaPassport: bestPassport};
    }
    if (via && d.ua) return {...d, access: d.ua, surprise: true, via};
    return {...d, access: VR(), surprise: false, blocked: true};
  }).filter(Boolean);
}

// ─── ANIMATED GLOBE ──────────────────────────────────────────────────
// Stylised rotating globe with latitude/longitude graticule, landmass dots,
// a plane that orbits, and optional destination markers that light up.
// Props: size (px), zoom (1 = normal), rotateSpeed (deg/sec), markers (array
// of {lon, lat, label, emoji}), activeMarkerIdx (number|null), showPlane
function Globe({ size = 220, zoom = 1, rotateSpeed = 14, markers = [], activeMarkerIdx = null, showPlane = true, glow = true }) {
  const [angle, setAngle] = useState(0);
  const rafRef = useRef(0);
  const lastRef = useRef(performance.now());

  useEffect(() => {
    const tick = (now) => {
      const dt = (now - lastRef.current) / 1000;
      lastRef.current = now;
      setAngle(a => (a + rotateSpeed * dt) % 360);
      rafRef.current = requestAnimationFrame(tick);
    };
    rafRef.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(rafRef.current);
  }, [rotateSpeed]);

  // project (lon, lat) where lon ∈ [-180,180], lat ∈ [-90,90] onto 2D
  // uses orthographic projection with current rotation about Y axis
  // returns {x, y, visible}
  const R = 100; // virtual radius in viewBox units
  const project = (lon, lat) => {
    const λ = ((lon + angle) * Math.PI) / 180;
    const φ = (lat * Math.PI) / 180;
    const x = R * Math.cos(φ) * Math.sin(λ);
    const y = -R * Math.sin(φ);
    const z = R * Math.cos(φ) * Math.cos(λ);
    return { x, y, visible: z > 0, z };
  };

  // landmass dots — rough outlines stored as (lon, lat) tuples
  const LAND = [
    // Europe
    ...gridPts(-10, 40, 40, 70, 6),
    // Africa
    ...gridPts(-15, -35, 50, 35, 7),
    // Asia
    ...gridPts(55, 10, 145, 70, 10),
    // SE Asia + Indonesia
    ...gridPts(95, -10, 140, 10, 5),
    // Australia
    ...gridPts(115, -38, 150, -12, 5),
    // N America
    ...gridPts(-165, 25, -60, 70, 9),
    // C America
    ...gridPts(-110, 10, -75, 30, 4),
    // S America
    ...gridPts(-80, -55, -35, 12, 7),
    // Arctic caps
    ...gridPts(-180, 70, 180, 80, 8),
  ];

  // latitude and longitude meridians
  const meridians = [];
  for (let lon = -180; lon < 180; lon += 30) meridians.push(lon);
  const parallels = [-60, -30, 0, 30, 60];

  // plane orbits at a tilted inclination — position based on its own angle
  const [planeAngle, setPlaneAngle] = useState(0);
  useEffect(() => {
    const id = setInterval(() => setPlaneAngle(a => (a + 2) % 360), 40);
    return () => clearInterval(id);
  }, []);
  const planePath = () => {
    // orbit radius slightly larger than globe
    const r = R * 1.12;
    const tilt = 25 * Math.PI / 180;
    const a = (planeAngle * Math.PI) / 180;
    const x = r * Math.cos(a);
    const y = r * Math.sin(a) * Math.sin(tilt) - r * 0.15;
    const z = r * Math.sin(a) * Math.cos(tilt);
    const rot = -planeAngle + 90;
    return { x, y, visible: z > 0, rot };
  };
  const plane = planePath();

  return (
    <div style={{
      width: size, height: size, position: 'relative',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
    }}>
      {glow && (
        <div style={{
          position: 'absolute', inset: -size * 0.2,
          background: `radial-gradient(circle, ${C.accent}22 0%, ${C.accent}08 40%, transparent 70%)`,
          pointerEvents: 'none',
        }}/>
      )}
      <svg viewBox="-130 -130 260 260" style={{width: '100%', height: '100%', overflow: 'visible'}}>
        <defs>
          <radialGradient id="globeGrad" cx="35%" cy="30%">
            <stop offset="0%" stopColor="#1e2a3f"/>
            <stop offset="60%" stopColor="#0d1320"/>
            <stop offset="100%" stopColor="#05080f"/>
          </radialGradient>
          <radialGradient id="globeRim" cx="50%" cy="50%" r="50%">
            <stop offset="85%" stopColor="transparent"/>
            <stop offset="100%" stopColor={C.accent} stopOpacity=".5"/>
          </radialGradient>
        </defs>
        {/* sphere */}
        <circle cx="0" cy="0" r={R * zoom} fill="url(#globeGrad)"/>
        {/* graticule (parallels) */}
        {parallels.map(lat => {
          const ry = R * Math.cos(lat * Math.PI / 180) * zoom;
          const cy = -R * Math.sin(lat * Math.PI / 180) * zoom;
          return <ellipse key={'p'+lat} cx="0" cy={cy} rx={ry} ry={ry * 0.18} fill="none" stroke={C.line2} strokeWidth=".4" opacity=".5"/>;
        })}
        {/* graticule (meridians) — as projected arcs */}
        {meridians.map(lon => {
          const pts = [];
          for (let lat = -90; lat <= 90; lat += 6) {
            const p = project(lon, lat);
            if (p.visible) pts.push(`${p.x * zoom},${p.y * zoom}`);
          }
          return pts.length > 1 ? <polyline key={'m'+lon} points={pts.join(' ')} fill="none" stroke={C.line2} strokeWidth=".4" opacity=".4"/> : null;
        })}
        {/* landmass dots */}
        {LAND.map((pt, i) => {
          const p = project(pt[0], pt[1]);
          if (!p.visible) return null;
          return <circle key={i} cx={p.x * zoom} cy={p.y * zoom} r={1.2 * zoom} fill={C.txt2} opacity={0.55 * (0.3 + 0.7 * (p.z / R))}/>;
        })}
        {/* markers (destinations) */}
        {markers.map((m, i) => {
          const p = project(m.lon, m.lat);
          if (!p.visible) return null;
          const active = i === activeMarkerIdx;
          return (
            <g key={i}>
              {active && <circle cx={p.x * zoom} cy={p.y * zoom} r="8" fill={C.accent} opacity=".18">
                <animate attributeName="r" values="5;14;5" dur="1.6s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values=".35;0;.35" dur="1.6s" repeatCount="indefinite"/>
              </circle>}
              <circle cx={p.x * zoom} cy={p.y * zoom} r={active ? 3 : 2} fill={active ? C.accent : C.accent2}/>
              {active && <circle cx={p.x * zoom} cy={p.y * zoom} r="1.2" fill="#fff"/>}
            </g>
          );
        })}
        {/* atmosphere rim */}
        <circle cx="0" cy="0" r={R * zoom} fill="url(#globeRim)"/>
        {/* plane */}
        {showPlane && plane.visible && (
          <g transform={`translate(${plane.x} ${plane.y}) rotate(${plane.rot})`}>
            {/* vapor trail */}
            <path d="M -18 0 L -4 0" stroke={C.accent} strokeWidth="1" strokeLinecap="round" opacity=".5"/>
            <path d="M -12 0 L -4 0" stroke="#fff" strokeWidth="1.2" strokeLinecap="round"/>
            {/* plane silhouette */}
            <path d="M 6 0 L -4 2.5 L -2 0 L -4 -2.5 Z" fill="#fff"/>
            <path d="M -2 -3 L 0 -1 L 1 -1 L -1 -3 Z" fill="#fff"/>
            <path d="M -2 3 L 0 1 L 1 1 L -1 3 Z" fill="#fff"/>
          </g>
        )}
      </svg>
    </div>
  );
}
// helper: evenly-spaced lon/lat grid points in a box (for landmass cloud)
function gridPts(lon0, lat0, lon1, lat1, density) {
  const out = [];
  const lonStep = (lon1 - lon0) / density;
  const latStep = (lat1 - lat0) / Math.max(1, Math.round(density * (lat1 - lat0) / (lon1 - lon0)));
  for (let lon = lon0; lon <= lon1; lon += lonStep) {
    for (let lat = lat0; lat <= lat1; lat += latStep) {
      // drop a few points randomly to make it organic
      if (((lon * 13 + lat * 7) | 0) % 5 !== 0) out.push([lon, lat]);
    }
  }
  return out;
}

// ─── INTERACTIVE WORLD MAP ───────────────────────────────────────────
// Background is a dot-pattern continent outline; countries are colored circles.
function WorldMap({ profile, onDetail }) {
  const [selected, setSelected] = useState(null);
  const [filter, setFilter] = useState('all');
  const results = computeAccess(profile.passports, profile.residence, profile.residenceExpiry, profile.visas);

  function accessKey(d) {
    if (d.blocked) return 'vr';
    if (d.surprise) return 'surprise';
    return d.access.type; // vf voa ev
  }

  const COL = { vf: C.vf, voa: C.voa, ev: C.ev, vr: C.vr, surprise: C.surprise };
  const filtered = filter === 'all' ? results :
    filter === 'surprise' ? results.filter(d => d.surprise) :
    results.filter(d => accessKey(d) === filter);

  // background continents as organic dot clusters
  const bgDots = [];
  // N America
  for (let i=0;i<60;i++) bgDots.push([40+Math.random()*70, 60+Math.random()*50]);
  // S America
  for (let i=0;i<40;i++) bgDots.push([70+Math.random()*30, 110+Math.random()*50]);
  // Europe
  for (let i=0;i<30;i++) bgDots.push([150+Math.random()*35, 55+Math.random()*25]);
  // Africa
  for (let i=0;i<60;i++) bgDots.push([160+Math.random()*40, 85+Math.random()*60]);
  // Middle East + W Asia
  for (let i=0;i<25;i++) bgDots.push([190+Math.random()*20, 70+Math.random()*25]);
  // Asia
  for (let i=0;i<70;i++) bgDots.push([210+Math.random()*70, 60+Math.random()*50]);
  // SE Asia
  for (let i=0;i<30;i++) bgDots.push([235+Math.random()*25, 100+Math.random()*25]);
  // Oceania
  for (let i=0;i<25;i++) bgDots.push([250+Math.random()*30, 135+Math.random()*25]);

  const stats = {
    vf: results.filter(d=>!d.surprise && !d.blocked && d.access.type==='vf').length,
    voa: results.filter(d=>!d.surprise && !d.blocked && (d.access.type==='voa'||d.access.type==='ev')).length,
    surprise: results.filter(d=>d.surprise).length,
    vr: results.filter(d=>d.blocked).length,
  };

  return (
    <div style={{height: '100%', background: C.bg, color: C.txt, display: 'flex', flexDirection: 'column'}}>
      <div style={{padding: '72px 20px 14px'}}>
        <div style={{fontSize: 12, letterSpacing: 2, textTransform: 'uppercase', color: C.txt3, fontWeight: 500, marginBottom: 4}}>World map</div>
        <div style={{fontFamily: 'Cormorant Garamond, serif', fontSize: 28, fontWeight: 300}}>
          Your <em style={{fontStyle: 'italic', color: C.accent}}>accessible</em> world
        </div>
      </div>

      {/* Map */}
      <div style={{padding: '0 16px', position: 'relative'}}>
        <div style={{
          background: C.bg2, borderRadius: 20, border: `1px solid ${C.line}`,
          padding: 8, position: 'relative', overflow: 'hidden',
        }}>
          <svg viewBox="0 0 320 180" style={{width: '100%', display: 'block'}}>
            {/* bg continent dots */}
            {bgDots.map((p,i) => <circle key={i} cx={p[0]} cy={p[1]} r="0.8" fill={C.line2} opacity=".8"/>)}
            {/* destination pins */}
            {filtered.map(d => {
              const k = accessKey(d);
              const c = COL[k];
              const isSel = selected?.c === d.c;
              return (
                <g key={d.c} style={{cursor: 'pointer'}} onClick={() => setSelected(d)}>
                  {isSel && <circle cx={d.x} cy={d.y} r="8" fill={c} opacity=".25"/>}
                  {d.surprise && <circle cx={d.x} cy={d.y} r="6" fill="none" stroke={c} strokeWidth="0.7" opacity=".6"/>}
                  <circle cx={d.x} cy={d.y} r={isSel ? 3.5 : 2.7} fill={c}
                    stroke={d.surprise ? C.bg2 : 'none'} strokeWidth={d.surprise ? 0.5 : 0}/>
                </g>
              );
            })}
          </svg>
          {/* legend */}
          <div style={{
            position: 'absolute', top: 12, right: 12,
            background: 'rgba(10,12,16,.7)', backdropFilter: 'blur(8px)',
            borderRadius: 10, padding: '8px 10px', fontSize: 10,
            display: 'flex', flexDirection: 'column', gap: 5,
          }}>
            <Legend c={C.vf} l="Visa-Free"/>
            <Legend c={C.voa} l="VOA / e-Visa"/>
            <Legend c={C.surprise} l="Surprise ✦" ring/>
            <Legend c={C.vr} l="Visa Required"/>
          </div>
        </div>
      </div>

      {/* stats */}
      <div style={{padding: '14px 16px', display: 'grid', gridTemplateColumns: '1fr 1fr 1fr 1fr', gap: 8}}>
        <Stat n={stats.vf} l="Visa-free" c={C.vf}/>
        <Stat n={stats.voa} l="VOA/eVisa" c={C.voa}/>
        <Stat n={stats.surprise} l="Surprise" c={C.surprise}/>
        <Stat n={stats.vr} l="Required" c={C.vr}/>
      </div>

      {/* filter chips */}
      <div style={{padding: '4px 16px 8px', display: 'flex', gap: 6, overflowX: 'auto'}}>
        {[['all','All'],['vf','Visa-Free'],['voa','VOA'],['ev','e-Visa'],['surprise','✦ Surprise'],['vr','Required']].map(([k,l]) => (
          <button key={k} onClick={()=>setFilter(k)} style={{
            padding: '6px 14px', borderRadius: 100, fontSize: 12, fontWeight: 500,
            background: filter===k ? 'rgba(34,211,238,.12)' : C.bg3,
            color: filter===k ? C.accent : C.txt2,
            border: `1px solid ${filter===k ? C.accent : C.line}`,
            fontFamily: 'inherit', whiteSpace: 'nowrap', flexShrink: 0,
          }}>{l}</button>
        ))}
      </div>

      {/* bottom sheet: selected country or scroll list */}
      <div style={{flex: 1, overflowY: 'auto', padding: '4px 16px 80px'}}>
        {selected ? (
          <SelectedSheet d={selected} onClose={()=>setSelected(null)} onDetail={()=>onDetail(selected)}/>
        ) : (
          <div style={{display: 'flex', flexDirection: 'column', gap: 8}}>
            <div style={{fontSize: 11, letterSpacing: 1.5, textTransform: 'uppercase', color: C.txt3, fontWeight: 600, padding: '8px 0 4px'}}>
              Tap a dot, or browse below
            </div>
            {filtered.slice(0, 20).map(d => <MiniRow key={d.c} d={d} onClick={()=>onDetail(d)}/>)}
          </div>
        )}
      </div>
    </div>
  );
}
const Legend = ({c, l, ring}) => (
  <div style={{display: 'flex', alignItems: 'center', gap: 6, color: C.txt2}}>
    {ring

          }}>{(user?.name?.[0] || 'A').toUpperCase()}</div>
          <div style={{flex: 1}}>
            <div style={{fontSize: 16, fontWeight: 600, color: C.txt}}>{user?.name || 'Alex Morgan'}</div>
            <div style={{fontSize: 13, color: C.txt3, display: 'flex', alignItems: 'center', gap: 4, marginTop: 2}}>
              {user?.provider === 'apple' && <span></span>}
              {user?.provider === 'google' && <span style={{color: '#ea4335'}}>G</span>}
              {user?.email || 'alex@whereto.next'}
            </div>
          </div>
        </div>
      </div>

      {/* Stat ribbon */}
      <div style={{padding: '0 20px 20px', display: 'flex', gap: 10}}>
        <MiniStat n={accessible} l="Accessible"/>
        <MiniStat n={results.filter(d=>d.surprise).length} l="Surprises"/>
        <MiniStat n={profile.visas.length + (profile.residence?1:0) + (profile.passports?.length||0)} l="Documents"/>
      </div>

      {/* Documents section */}
      <Section title="My Documents">
        <Row icon="🛂" label={passports.length > 1 ? 'Passports' : 'Passport'} value={passports.length ? passports.map(p => `${p.flag} ${p.name}`).join(' · ') : 'Not set'}/>
        <Row icon="🏠" label="Residence" value={residence ? `${residence.name}${profile.residenceExpiry ? ' · exp ' + fmtDate(profile.residenceExpiry) : ''}` : 'Not set'}/>
        <Row icon="📄" label="Visas" value={profile.visas.length ? profile.visas.map(v => { const info = VISAS.find(x=>x.code===v.code); return info?.short + (v.expiry ? ` (${fmtDate(v.expiry)})` : ''); }).join(', ') : 'None added'}/>
        <Row icon="✎" label="Edit documents" onClick={onEdit} arrow/>
      </Section>

      <Section title="Preferences">
        <Row icon="🔔" label="Visa policy alerts" value="On" arrow/>
        <Row icon="🌐" label="Language" value="English" arrow/>
        <Row icon="💳" label="Flights provider" value="Google Flights" arrow/>
      </Section>

      <Section title="Support">
        <Row icon="❔" label="Help & FAQ" arrow/>
        <Row icon="🔒" label="Privacy Policy" arrow/>
        <Row icon="📜" label="Terms of Service" arrow/>
      </Section>

      <div style={{padding: '8px 20px 24px'}}>
        <button onClick={onLogout} style={{
          width: '100%', height: 52, borderRadius: 14, background: 'transparent',
          border: `1px solid ${C.line2}`, color: C.vr, fontSize: 15, fontWeight: 500,
          fontFamily: 'inherit', cursor: 'pointer',
        }}>Sign out</button>
      </div>
      <div style={{textAlign: 'center', fontSize: 11, color: C.txt3, padding: '0 20px 20px'}}>
        WhereToNext v1.0.0 · Made with care
      </div>
    </div>
  );
}
const MiniStat = ({n, l}) => (
  <div style={{flex: 1, background: C.bg2, border: `1px solid ${C.line}`, borderRadius: 14, padding: '14px 10px', textAlign: 'center'}}>
    <div style={{fontFamily: 'Cormorant Garamond, serif', fontSize: 26, fontWeight: 300, color: C.txt, lineHeight: 1}}>{n}</div>
    <div style={{fontSize: 11, color: C.txt3, marginTop: 4, letterSpacing: .3}}>{l}</div>
  </div>
);
const Section = ({title, children}) => (
  <div style={{padding: '0 20px 20px'}}>
    <div style={{fontSize: 11, letterSpacing: 1.5, textTransform: 'uppercase', color: C.txt3, fontWeight: 600, padding: '0 4px 8px'}}>{title}</div>
    <div style={{background: C.bg2, border: `1px solid ${C.line}`, borderRadius: 16, overflow: 'hidden'}}>
      {children}
    </div>
  </div>
);
const Row = ({icon, label, value, arrow, onClick}) => (
  <div onClick={onClick} style={{
    display: 'flex', alignItems: 'center', gap: 12, padding: '14px 16px',
    borderBottom: `1px solid ${C.line}`, cursor: onClick ? 'pointer' : 'default',
  }}>
    <span style={{fontSize: 18, width: 24, textAlign: 'center'}}>{icon}</span>
    <span style={{flex: 1, fontSize: 14, color: C.txt}}>{label}</span>
    {value && <span style={{fontSize: 13, color: C.txt2, maxWidth: 180, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap'}}>{value}</span>}
    {arrow && <svg width="8" height="14" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6" stroke={C.txt3} strokeWidth="1.5" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>}
  </div>
);

// ─── DETAIL PAGE ─────────────────────────────────────────────────────
function DetailPage({ d, profile, onBack }) {
  const passport = PASSPORTS.find(p => p.code === (d.viaPassport || profile.passports?.[0]));
  const badge = d.surprise ? {bg:'rgba(34,211,238,.18)',fg:C.surprise,l:'✦ Surprise Unlock'} : BADGE[d.access.type];
  const via = d.via ? (d.via==='schengen'?'Schengen Visa/Residence':d.via==='us'?'US B1/B2 Visa':d.via==='uk'?'UK Visa':d.via==='ca'?'Canada Visa':d.via.toUpperCase()) : null;
  return (
    <div style={{height: '100%', background: C.bg, color: C.txt, overflowY: 'auto', paddingBottom: 40}}>
      {/* hero */}
      <div style={{
        height: 240, background: `linear-gradient(135deg, ${d.g[0]}, ${d.g[1]})`,
        padding: '80px 20px 20px', position: 'relative', display: 'flex', flexDirection: 'column', justifyContent: 'flex-end',
      }}>
        <div style={{position: 'absolute', inset: 0, background: 'linear-gradient(to bottom, rgba(0,0,0,.3), transparent 40%, rgba(0,0,0,.4))'}}/>
        <div onClick={onBack} style={{
          position: 'absolute', top: 70, left: 16, zIndex: 2,
          width: 36, height: 36, borderRadius: '50%', background: 'rgba(0,0,0,.35)',
          backdropFilter: 'blur(8px)', display: 'flex', alignItems: 'center', justifyContent: 'center',
          cursor: 'pointer',
        }}>
          <svg width="14" height="14" viewBox="0 0 14 14"><path d="M9 3L5 7l4 4" stroke="#fff" strokeWidth="1.8" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </div>
        <span style={{position: 'absolute', top: 60, right: 22, fontSize: 68, filter: 'drop-shadow(0 4px 12px #0006)', zIndex: 2}}>{d.f}</span>
        <div style={{position: 'relative', zIndex: 2}}>
          <div style={{fontSize: 11, letterSpacing: 2, textTransform: 'uppercase', color: 'rgba(255,255,255,.6)', marginBottom: 6, fontWeight: 500}}>{d.r}</div>
          <div style={{fontFamily: 'Cormorant Garamond, serif', fontSize: 38, fontWeight: 300, color: '#fff', lineHeight: 1}}>{d.n}</div>
          <div style={{fontSize: 13, color: 'rgba(255,255,255,.65)', marginTop: 6}}>{d.tl}</div>
        </div>
      </div>

      {/* Entry summary card */}
      <div style={{padding: '20px 20px 0'}}>
        <div style={{
          background: C.bg2, border: `1px solid ${C.line}`, borderRadius: 20, padding: 18,
        }}>
          <div style={{fontSize: 11, letterSpacing: 1.5, textTransform: 'uppercase', color: C.txt3, fontWeight: 600, marginBottom: 14}}>
            Entry for {passport?.flag} {passport?.name}
          </div>
          <div style={{display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12}}>
            <div style={{flex: 1}}>
              <span style={{
                padding: '4px 12px', borderRadius: 100, fontSize: 11, fontWeight: 600,
                background: badge.bg, color: badge.fg, display: 'inline-block',
              }}>{badge.l}</span>
              <div style={{fontSize: 13, color: C.txt2, marginTop: 10, lineHeight: 1.6}}>
                {d.surprise ? `Accessible via your ${via} — not your passport alone.` : 'Your passport grants you entry to this destination.'}
              </div>
            </div>
            {d.access.days && (
              <div style={{textAlign: 'right'}}>
                <div style={{fontFamily: 'Cormorant Garamond, serif', fontSize: 40, fontWeight: 300, color: C.accent, lineHeight: 1}}>{d.access.days}</div>
                <div style={{fontSize: 10, color: C.txt3, letterSpacing: 1, textTransform: 'uppercase'}}>days max</div>
              </div>
            )}
          </div>
          <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginTop: 16, paddingTop: 16, borderTop: `1px solid ${C.line}`}}>
            <MetaItem k="Currency" v={d.cu}/>
            <MetaItem k="Language" v={d.la}/>
            <MetaItem k="Method" v={d.surprise ? `Via ${via?.split(' ')[0]}` : 'Passport'}/>
            <MetaItem k="Type" v={badge.l}/>
          </div>
        </div>
      </div>

      {/* Entry note */}
      <div style={{padding: '16px 20px'}}>
        <div style={{fontSize: 11, letterSpacing: 1.5, textTransform: 'uppercase', color: C.txt3, fontWeight: 600, marginBottom: 10}}>Entry requirements</div>
        <div style={{
          background: 'rgba(34,211,238,.06)', border: `1px solid rgba(34,211,238,.2)`,
          borderRadius: 14, padding: 14, fontSize: 13, color: C.txt2, lineHeight: 1.6,
        }}>{d.nt}</div>
      </div>

      {/* Highlights */}
      <div style={{padding: '8px 20px 16px'}}>
        <div style={{fontSize: 11, letterSpacing: 1.5, textTransform: 'uppercase', color: C.txt3, fontWeight: 600, marginBottom: 10}}>Not to be missed</div>
        <div style={{display: 'flex', flexWrap: 'wrap', gap: 6}}>
          {d.hl.map(h => (
            <span key={h} style={{
              padding: '6px 12px', background: C.bg3, border: `1px solid ${C.line}`,
              borderRadius: 100, fontSize: 12, color: C.txt2,
            }}>{h}</span>
          ))}
        </div>
      </div>

      {/* Disclaimer */}
      <div style={{padding: '8px 20px 16px'}}>
        <div style={{
          background: 'rgba(250,204,21,.05)', border: `1px solid rgba(250,204,21,.2)`,
          borderRadius: 14, padding: 14, fontSize: 12, color: C.txt3, lineHeight: 1.6,
        }}>
          <strong style={{color: C.accent2}}>Disclaimer:</strong> Visa policies change frequently. Always verify entry requirements with the official embassy of your destination before travelling. WhereToNext is not liable for travel disruptions.
        </div>
      </div>

      {/* CTA */}
      <div style={{padding: '8px 20px 20px', display: 'flex', flexDirection: 'column', gap: 10}}>
        <button onClick={() => window.open('https://www.google.com/flights', '_blank')} style={{
          height: 54, borderRadius: 27, background: C.accent, color: '#000',
          fontSize: 15, fontWeight: 600, border: 'none', fontFamily: 'inherit',
          display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, cursor: 'pointer',
        }}>
          ✈ See Flights
        </button>
        <button style={{
          height: 48, borderRadius: 24, background: 'transparent', border: `1px solid ${C.line2}`,
          color: C.txt2, fontSize: 14, fontWeight: 500, fontFamily: 'inherit', cursor: 'pointer',
        }}>♥ Save to trips</button>
      </div>
    </div>
  );
}
const MetaItem = ({k, v}) => (
  <div>
    <div style={{fontSize: 10, letterSpacing: 1, textTransform: 'uppercase', color: C.txt3, fontWeight: 600, marginBottom: 2}}>{k}</div>
    <div style={{fontSize: 13, fontWeight: 500, color: C.txt}}>{v}</div>
  </div>
);

// ─── TAB BAR ─────────────────────────────────────────────────────────
function TabBar({ tab, setTab }) {
  const tabs = [
    {k:'home', l:'Discover', icon:(c)=><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M3 10L11 3l8 7v9a1 1 0 01-1 1h-4v-6H8v6H4a1 1 0 01-1-1v-9z" stroke={c} strokeWidth="1.6" strokeLinejoin="round"/></svg>},
    {k:'map', l:'Map', icon:(c)=><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="8" stroke={c} strokeWidth="1.6"/><path d="M3 11h16M11 3c2.5 2.5 2.5 13.5 0 16M11 3c-2.5 2.5-2.5 13.5 0 16" stroke={c} strokeWidth="1.6"/></svg>},
    {k:'profile', l:'Profile', icon:(c)=><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="8" r="3.5" stroke={c} strokeWidth="1.6"/><path d="M4 19c1.5-3 4-4.5 7-4.5s5.5 1.5 7 4.5" stroke={c} strokeWidth="1.6" strokeLinecap="round"/></svg>},
  ];
  return (
    <div style={{
      position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 50,
      padding: '8px 20px 28px',
      background: 'linear-gradient(to top, rgba(10,12,16,.98) 60%, rgba(10,12,16,.8))',
      backdropFilter: 'blur(20px)',
      borderTop: `1px solid ${C.line}`,
      display: 'flex', justifyContent: 'space-around', alignItems: 'center',
    }}>
      {tabs.map(t => (
        <div key={t.k} onClick={()=>setTab(t.k)} style={{
          display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3,
          padding: '6px 20px', cursor: 'pointer',
          color: tab === t.k ? C.accent : C.txt3,
        }}>
          {t.icon(tab === t.k ? C.accent : C.txt3)}
          <span style={{fontSize: 10, fontWeight: 600, letterSpacing: .3}}>{t.l}</span>
        </div>
      ))}
    </div>
  );
}

// ─── APP ─────────────────────────────────────────────────────────────
function MobileApp() {
  const [screen, setScreen] = useState(ls('screen', 'splash'));
  const [tab, setTab] = useState(ls('tab', 'home'));
  // migrate old profile schema: {passport} -> {passports:[...]}, visas:['a'] -> [{code:'a',expiry:''}]
  const [profile, setProfile] = useState(() => {
    const p = ls('profile', null);
    if (!p) return null;
    const migrated = {
      passports: p.passports ?? (p.passport ? [p.passport] : []),
      residence: p.residence || '',
      residenceExpiry: p.residenceExpiry || '',
      visas: Array.isArray(p.visas) && p.visas.length && typeof p.visas[0] === 'string'
        ? p.visas.map(c => ({code: c, expiry: ''}))
        : (p.visas || []),
    };
    return migrated;
  });
  const [user, setUser] = useState(ls('user', null));
  const [detail, setDetail] = useState(null);

  useEffect(() => ss('screen', screen), [screen]);
  useEffect(() => ss('tab', tab), [tab]);

  function handleAuth(provider) {
    const fake = {
      apple: {name: 'Alex Morgan', email: 'alex@privaterelay.apple', provider: 'apple'},
      google: {name: 'Alex Morgan', email: 'alex.morgan@gmail.com', provider: 'google'},
      email: {name: 'Alex Morgan', email: 'alex@whereto.next', provider: 'email'},
      guest: {name: 'Guest', email: 'guest@whereto.next', provider: 'guest'},
    };
    setUser(fake[provider]);
    ss('user', fake[provider]);
    setScreen(profile ? 'main' : 'entry');
  }

  function handleSubmit(data) {
    setProfile(data);
    ss('profile', data);
    setScreen('main');
  }

  function logout() {
    setUser(null); setProfile(null); ss('user', null); ss('profile', null);
    setScreen('auth');
  }

  let content;
  if (screen === 'splash')        content = <Splash onNext={() => setScreen('onboard')}/>;
  else if (screen === 'onboard')  content = <Onboarding onNext={() => setScreen('auth')}/>;
  else if (screen === 'auth')     content = <Auth onNext={handleAuth}/>;
  else if (screen === 'entry')    content = <DataEntry initial={profile} onSubmit={handleSubmit}/>;
  else if (screen === 'main' && profile) {
    content = (
      <div style={{height: '100%', position: 'relative'}}>
        {detail
          ? <DetailPage d={detail} profile={profile} onBack={()=>setDetail(null)}/>
          : <>
              {tab === 'home' && <HomeTab profile={profile} onDetail={setDetail}/>}
              {tab === 'map' && <WorldMap profile={profile} onDetail={setDetail}/>}
              {tab === 'profile' && <ProfileTab profile={profile} user={user} onEdit={()=>setScreen('entry')} onLogout={logout}/>}
              <TabBar tab={tab} setTab={setTab}/>
            </>
        }
      </div>
    );
  }

  return (
    <div className="stage">
      <div className="mobile-app">
        <IOSDevice dark>
          {content}
        </IOSDevice>
      </div>
      {/* dev controls */}
      <div style={{position: 'absolute', bottom: -48, left: 0, right: 0, display: 'flex', gap: 6, justifyContent: 'center'}}>
        {['splash','onboard','auth','entry','main'].map(s => (
          <button key={s} onClick={()=>setScreen(s)} style={{
            padding: '4px 10px', fontSize: 11, borderRadius: 100,
            background: screen===s?C.accent:'transparent', color: screen===s?'#000':C.txt3,
            border: `1px solid ${screen===s?C.accent:C.line2}`, cursor: 'pointer', fontFamily: 'inherit',
          }}>{s}</button>
        ))}
      </div>
    </div>
  );
}

// Minimal inline iOS frame
function IOSDevice({ children, dark }) {
  return (
    <div style={{
      width: 402, height: 874, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      boxShadow: '0 40px 80px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.06)',
      fontFamily: '-apple-system, system-ui, sans-serif',
    }}>
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
      }}/>
      <div style={{
        position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10,
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '20px 32px 14px', pointerEvents: 'none',
      }}>
        <span style={{fontSize: 15, fontWeight: 600, color: dark?'#fff':'#000'}}>9:41</span>
        <div style={{display: 'flex', gap: 6, alignItems: 'center'}}>
          <svg width="17" height="11" viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" rx=".5" fill={dark?'#fff':'#000'}/><rect x="4.5" y="5" width="3" height="6" rx=".5" fill={dark?'#fff':'#000'}/><rect x="9" y="2.5" width="3" height="8.5" rx=".5" fill={dark?'#fff':'#000'}/><rect x="13.5" y="0" width="3" height="11" rx=".5" fill={dark?'#fff':'#000'}/></svg>
          <svg width="15" height="11" viewBox="0 0 15 11"><path d="M7.5 2.8c2 0 3.9.8 5.2 2.1l1-1A8.7 8.7 0 007.5 1.2 8.7 8.7 0 001.3 3.9l1 1A7.4 7.4 0 017.5 2.8zm0 3.2c1.2 0 2.3.5 3.1 1.3l1-1A6 6 0 007.5 4.6a6 6 0 00-4.1 1.7l1 1A4.4 4.4 0 017.5 6zM7.5 9a1.3 1.3 0 100 2.5 1.3 1.3 0 000-2.5z" fill={dark?'#fff':'#000'}/></svg>
          <div style={{width: 24, height: 11, border: `1px solid ${dark?'#fff':'#000'}66`, borderRadius: 3, padding: 1, position: 'relative'}}>
            <div style={{width: '80%', height: '100%', background: dark?'#fff':'#000', borderRadius: 1}}/>
          </div>
        </div>
      </div>
      <div style={{height: '100%'}}>{children}</div>
      <div style={{
        position: 'absolute', bottom: 8, left: '50%', transform: 'translateX(-50%)',
        width: 139, height: 5, borderRadius: 100, zIndex: 60,
        background: dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.25)',
      }}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<MobileApp/>);
</script>
</body>
</html>
