  ]);

  function computeDestinations(passportCode, residenceCode, selectedVisas) {
    const passport = PASSPORTS.find(p => p.code === passportCode);
    if (!passport) return { accessible: [], surprising: [] };
    const tier = passport.tier;

    // Build effective visa set
    const effectiveVisas = new Set(selectedVisas || []);
    if (residenceCode) {
      const res = RESIDENCE_COUNTRIES.find(r => r.code === residenceCode);
      if (res?.schengen || SCHENGEN_CODES.has(residenceCode)) effectiveVisas.add('schengen');

      if (residenceCode === 'GB') effectiveVisas.add('uk-visitor');
      if (residenceCode === 'CA') effectiveVisas.add('canada-trv');
      if (residenceCode === 'AE') effectiveVisas.add('uae-res');
      if (residenceCode === 'JP') effectiveVisas.add('japan-visa');
    }

    const accessible = [];
    const surprising = [];

    for (const dest of DESTINATIONS) {
      if (dest.code === passportCode) continue; // skip own country

      const tierAccess = dest.tiers[tier - 1];
      const unlockVia = dest.visaUnlocks.find(v => effectiveVisas.has(v));

      let access = null;
      let isSurprising = false;
      let unlockViaCode = null;

      if (tierAccess && tierAccess.type !== 'visa-required') {
        access = { ...tierAccess };
      } else if (unlockVia && dest.visaUnlockAccess) {
        access = { ...dest.visaUnlockAccess };
        isSurprising = true;
        unlockViaCode = unlockVia;
      }

      if (access) {
        const result = { ...dest, access, isSurprising, unlockViaCode };
        accessible.push(result);
        if (isSurprising) surprising.push(result);
      }
    }

    // Sort: surprising first by name, then rest by region
    accessible.sort((a, b) => {
      if (a.isSurprising && !b.isSurprising) return -1;
      if (!a.isSurprising && b.isSurprising) return 1;
      return a.name.localeCompare(b.name);
    });

    return { accessible, surprising };
  }

  function getVisaLabel(visa) {
    return VISAS.find(v => v.code === visa)?.short || visa;
  }

  return { PASSPORTS, VISAS, RESIDENCE_COUNTRIES, DESTINATIONS, computeDestinations, getVisaLabel };
})();

<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;
const { PASSPORTS, VISAS, RESIDENCE_COUNTRIES, computeDestinations, getVisaLabel } = window.WTN;

// ── Helpers ──────────────────────────────────────────────────────────
const ACCESS_LABELS = { 'visa-free':'Visa-Free', 'visa-on-arrival':'Visa on Arrival', 'e-visa':'e-Visa', 'visa-required':'Visa Required' };
const ACCESS_BADGE  = { 'visa-free':'badge-vf', 'visa-on-arrival':'badge-voa', 'e-visa':'badge-ev' };

function saveState(key, val) { try { localStorage.setItem('wtn_'+key, JSON.stringify(val)); } catch(e){} }
function loadState(key, def) { try { const v = localStorage.getItem('wtn_'+key); return v ? JSON.parse(v) : def; } catch(e){ return def; } }

// ── SearchSelect ──────────────────────────────────────────────────────
function SearchSelect({ options, value, onChange, placeholder }) {
  const [open, setOpen] = useState(false);
  const [q, setQ] = useState('');
  const wrapRef = useRef();

  useEffect(() => {
    const h = e => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);

  const selected = options.find(o => o.code === value);
  const filtered = options.filter(o => o.name.toLowerCase().includes(q.toLowerCase()));

  return (
    <div className="ss-wrap" ref={wrapRef}>
      <div className={`ss-input-row ${open ? 'open' : ''}`} onClick={() => { setOpen(!open); setQ(''); }}>
        <span className="ss-flag">{selected?.flag || '🌐'}</span>
        <input
          className="ss-input"
          placeholder={placeholder}
          value={open ? q : (selected?.name || '')}
          onChange={e => { setQ(e.target.value); if (!open) setOpen(true); }}
          onClick={e => { e.stopPropagation(); setOpen(true); }}
          readOnly={!open}
        />
        <svg className={`ss-chevron ${open ? 'open' : ''}`} width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M4 6l4 4 4-4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      </div>
      {open && (
        <div className="ss-dropdown">
          {filtered.length === 0 ? <div className="ss-empty">No results</div> : filtered.map(o => (
            <div key={o.code} className={`ss-option ${o.code === value ? 'active' : ''}`}
              onClick={() => { onChange(o.code); setOpen(false); setQ(''); }}>
              <span className="ss-option-flag">{o.flag}</span>
              <span>{o.name}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── Nav ───────────────────────────────────────────────────────────────
function Nav({ page, onHome, onEdit }) {
  return (
    <nav className="nav">
      <div className="nav-logo" onClick={onHome}>
        <span className="nav-logo-dot"/> WhereToNext
      </div>
      {page === 'results' && <span className="nav-action" onClick={onEdit}>Edit documents</span>}
      {page === 'detail'  && <span className="nav-action" onClick={() => history.back?.()}>← Results</span>}

}

// ── HOME PAGE ─────────────────────────────────────────────────────────

    <div className="home page-enter">
      <div className="hero-bg"/>
      <div className="hero-glow"/>
      <div className="home-eyebrow">Passport intelligence</div>
      <h1 className="home-h1">Your passport is more<br/><em>powerful</em> than you think.</h1>
      <p className="home-sub">Discover every country you can visit — including the ones made accessible by your residence permit and existing visas.</p>
      <button className="home-cta" onClick={onStart}>
        Start Exploring
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M4 9h10M10 5l4 4-4 4" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      </button>
      <div className="home-stats">
        <div className="home-stat"><strong>195</strong>Countries covered</div>
        <div className="home-stat"><strong>50+</strong>Visa unlock rules</div>
        <div className="home-stat"><strong>Free</strong>Always</div>
      </div>
      <div className="home-features">
        <div className="home-feat">
          <div className="home-feat-icon">🛂</div>
          <h3>Passport access</h3>
          <p>See what countries your nationality can visit, sorted by entry type and stay duration.</p>
        </div>

          <div className="home-feat-icon">🏠</div>
          <h3>Residence unlocks</h3>
          <p>Your Schengen or US residence permit opens additional doors not visible in passport rankings.</p>

// ── INPUT PAGE ────────────────────────────────────────────────────────
function InputPage({ initial, onSubmit }) {
  const [passport, setPassport]   = useState(initial?.passport || '');
  const [residence, setResidence] = useState(initial?.residence || '');
  const [visas, setVisas]         = useState(initial?.visas || []);

  function toggleVisa(code) {
    setVisas(v => v.includes(code) ? v.filter(x => x !== code) : [...v, code]);
  }

  function handleSubmit() {
    if (!passport) return;
    const data = { passport, residence, visas };
    saveState('profile', data);
    onSubmit(data);
  }

  // Filter out visas that are already implied by passport
  const passportObj = PASSPORTS.find(p => p.code === passport);
  const residenceObj = RESIDENCE_COUNTRIES.find(r => r.code === residence);

  return (
    <div className="form-page page-enter">
      <div className="form-wrap">
        <div className="form-header">
          <div className="form-eyebrow">Step 1 of 1</div>
          <h2 className="form-title">Tell us about your<br/><em>travel documents</em></h2>
        </div>

        <div className="form-group">
          <label className="form-label">Passport nationality <span>required</span></label>
          <SearchSelect
            options={PASSPORTS}
            value={passport}
            onChange={setPassport}
            placeholder="Select your passport country…"
          />
        </div>

        <div className="form-group">
          <label className="form-label">Country of residence <span>optional</span></label>
          <SearchSelect
            options={RESIDENCE_COUNTRIES}
            value={residence}
            onChange={setResidence}
            placeholder="Where do you currently live?"
          />
          <p className="form-hint">Living in a Schengen country or the US/UK may unlock additional destinations.</p>
        </div>

        <div className="form-divider"/>

        <div className="form-group">
          <label className="form-label">Existing visas or permits <span>optional, select all that apply</span></label>
          <div className="visa-grid">
            {VISAS.map(v => {
              const sel = visas.includes(v.code);
              return (
                <div key={v.code} className={`visa-chip ${sel ? 'selected' : ''}`} onClick={() => toggleVisa(v.code)}>
                  <div className="visa-chip-check">
                    {sel && <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="#000" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                  </div>
                  <div>
                    <div className="visa-chip-label">{v.name}</div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        <div style={{height: 32}}/>
        <button className="submit-btn" disabled={!passport} onClick={handleSubmit}>
          Find My Destinations
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M4 9h10M10 5l4 4-4 4" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  );
}

// ── DESTINATION CARD ──────────────────────────────────────────────────
function DestCard({ dest, onClick, cardStyle }) {
  const { name, flag, region, tagline, gradient, accent, access, isSurprising } = dest;
  const badgeClass = isSurprising ? 'badge-surprise' : (ACCESS_BADGE[access.type] || 'badge-vf');
  const heroStyle = cardStyle === 'vivid'
    ? { background: `linear-gradient(135deg, ${gradient[0]} 0%, ${gradient[1]} 100%)` }
    : cardStyle === 'minimal'
    ? { background: `var(--bg3)` }
    : { background: `linear-gradient(135deg, ${gradient[0]} 0%, ${gradient[1]} 100%)` };

  return (
    <div className="dest-card" onClick={() => onClick(dest)}>
      {isSurprising && <div className="surprise-banner">Surprise</div>}
      <div className="dest-card-hero" style={heroStyle}>
        <span className="dest-card-flag">{flag}</span>
        <div className="dest-card-region">{region}</div>
      </div>
      <div className="dest-card-body">
        <div className="dest-card-name">{name}</div>
        <div className="dest-card-tagline">{tagline}</div>
        <div className="dest-card-footer">
          <span className={`access-badge ${badgeClass}`}>{ACCESS_LABELS[access.type]}</span>
          {access.days && <span className="dest-card-days">Up to {access.days} days</span>}
        </div>
      </div>
    </div>
  );
}

// ── RESULTS PAGE ──────────────────────────────────────────────────────
function ResultsPage({ profile, onEdit, onDetail }) {
  const [filter, setFilter] = useState('All');
  const [cardStyle, setCardStyle] = useState(loadState('cardStyle', 'default'));

  const { accessible, surprising } = computeDestinations(profile.passport, profile.residence, profile.visas);
  const passport = PASSPORTS.find(p => p.code === profile.passport);

  const regions = ['All', ...new Set(accessible.map(d => d.region))].sort((a,b) => a === 'All' ? -1 : 0);
  const filtered = filter === 'All' ? accessible : accessible.filter(d => d.region === filter);
  const nonSurprising = filtered.filter(d => !d.isSurprising);

  useEffect(() => { saveState('cardStyle', cardStyle); }, [cardStyle]);

  return (
    <div className="results-page page-enter">
      <div className="results-header">
        <div className="results-header-left">
          <div className="results-eyebrow">Your results</div>
          <div className="results-title">
            <span>{passport?.flag}</span>
            <span>{passport?.name} passport</span>
          </div>
          <div className="results-count">{accessible.length} destinations accessible · {surprising.length} surprising finds</div>
        </div>
        <button className="results-edit" onClick={onEdit}>Edit documents</button>
      </div>

      {/* Surprising section */}
      {surprising.length > 0 && (
        <>
          <h2 className="section-title">
            <span style={{color:'var(--accent)'}}>✦</span>
            Places You Didn't Know You Could Visit
          </h2>
          <p className="section-sub">
            These destinations are accessible because of your{' '}
            {[...new Set(surprising.map(d => getVisaLabel(d.unlockViaCode)))].join(' and ')} — not your passport alone.
          </p>
          <div className="cards-grid" style={{marginBottom: 0}}>
            {surprising.map(d => <DestCard key={d.code} dest={d} onClick={onDetail} cardStyle={cardStyle}/>)}
          </div>
          <div className="section-divider"/>
        </>
      )}

      {/* All accessible */}
      <h2 className="section-title">All Accessible Destinations</h2>
      <div className="filter-row">
        {regions.map(r => (
          <button key={r} className={`filter-chip ${filter === r ? 'active' : ''}`} onClick={() => setFilter(r)}>{r}</button>
        ))}
      </div>
      {nonSurprising.length === 0 && filtered.length === 0 ? (
        <div className="no-results">
          <h3>No destinations in this region</h3>
          <p>Try a different filter above.</p>
        </div>
      ) : (
        <div className="cards-grid">
          {(filter === 'All' ? nonSurprising : filtered.filter(d => !d.isSurprising)).map(d =>
            <DestCard key={d.code} dest={d} onClick={onDetail} cardStyle={cardStyle}/>
          )}
          {filter !== 'All' && filtered.filter(d => d.isSurprising).map(d =>
            <DestCard key={d.code} dest={d} onClick={onDetail} cardStyle={cardStyle}/>
          )}
        </div>
      )}

      {/* Tweaks panel (controlled by parent) */}
      <div id="tweaks-results" className="tweaks-panel">
        <div className="tweaks-title">Tweaks</div>
        <div className="tweak-row">
          <div className="tweak-label">Card style</div>
          <div className="tweak-options">
            {['default','vivid','minimal'].map(s => (
              <div key={s} className={`tweak-opt ${cardStyle===s?'on':''}`} onClick={() => setCardStyle(s)}>
                {s.charAt(0).toUpperCase()+s.slice(1)}
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── DETAIL PAGE ───────────────────────────────────────────────────────
function DetailPage({ dest, profile, onBack }) {
  const { name, flag, region, tagline, gradient, accent, access, highlights, currency, language, entryNote, isSurprising, unlockViaCode } = dest;
  const passport = PASSPORTS.find(p => p.code === profile.passport);

  const heroGrad = `linear-gradient(135deg, ${gradient[0]} 0%, ${gradient[1]} 100%)`;
  const accessLabel = ACCESS_LABELS[access.type] || access.type;

  const unlockLabel = unlockViaCode ? getVisaLabel(unlockViaCode) : null;

  return (
    <div className="detail-page page-enter">
      <div className="detail-hero" style={{background: heroGrad}}>
        <div className="detail-hero-overlay"/>
        <div className="detail-hero-back" onClick={onBack}>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M10 4L6 8l4 4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
          Back
        </div>
        <span className="detail-hero-flag">{flag}</span>
        <div className="detail-hero-text">
          <div className="detail-hero-region">{region}</div>
          <div className="detail-hero-name">{name}</div>
          <div className="detail-hero-tagline">{tagline}</div>

      </div>

      <div className="detail-body">
        {/* Entry summary */}
        <div className="detail-section">
          <div className="detail-section-title">Entry summary for {passport?.flag} {passport?.name} passport</div>
          <div className="detail-entry-card">
            <div className="detail-entry-row">
              <div className="detail-entry-main">
                <div className="detail-entry-type">{accessLabel}</div>
                <div className="detail-entry-desc">
                  {isSurprising
                    ? `Accessible via your ${unlockLabel} — not your passport alone. This is a visa unlock.`
                    : `Your passport grants you ${accessLabel.toLowerCase()} entry to ${name}.`}
                </div>
              </div>
              {access.days && (
                <div className="detail-entry-days">
                  <div className="detail-entry-days-num">{access.days}</div>

            </div>
            <div className="detail-meta">
              <div className="detail-meta-item">
                <div className="detail-meta-key">Currency</div>
                <div className="detail-meta-val">{currency}</div>
              </div>
              <div className="detail-meta-item">
                <div className="detail-meta-key">Language</div>
                <div className="detail-meta-val">{language}</div>
              </div>
              <div className="detail-meta-item">
                <div className="detail-meta-key">Entry method</div>
                <div className="detail-meta-val">{isSurprising ? `Via ${unlockLabel}` : 'Passport'}</div>
              </div>
              <div className="detail-meta-item">
                <div className="detail-meta-key">Access type</div>
                <div className="detail-meta-val">{accessLabel}</div>
              </div>
            </div>
          </div>
        </div>

        {/* Entry note */}
        <div className="detail-section">
          <div className="detail-section-title">Entry requirements</div>
          <div className="detail-note">{entryNote}</div>
        </div>

        {/* Highlights */}
        <div className="detail-section">
          <div className="detail-section-title">Not to be missed</div>
          <div className="detail-highlights">
            {highlights.map(h => <span key={h} className="detail-highlight">{h}</span>)}
          </div>
        </div>

        {/* Disclaimer */}
        <div className="detail-section">
          <div className="detail-disclaimer">
            <strong style={{color:'var(--accent2)'}}>Disclaimer:</strong> Visa policies change frequently. This information is provided for general guidance only and may not reflect the latest regulations. Always verify entry requirements with the official embassy or consulate of your destination before travelling. WhereToNext is not liable for any travel disruptions.
          </div>
        </div>

        <div className="detail-cta">
          <button className="detail-cta-btn" onClick={() => window.open('https://www.google.com/flights', '_blank')}>
            See Flights
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M4 8h8M9 5l3 3-3 3" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>

          </button>
          <button className="detail-cta-sec" onClick={onBack}>← Back to results</button>

}

// ── APP ───────────────────────────────────────────────────────────────
function App() {
  const savedProfile = loadState('profile', null);
  const [page, setPage]       = useState(loadState('page', 'home'));
  const [profile, setProfile] = useState(savedProfile);
  const [selected, setSelected] = useState(null);
  const [tweaksVisible, setTweaksVisible] = useState(false);

  useEffect(() => { saveState('page', page); }, [page]);

  // Tweaks toggle via parent postMessage
  useEffect(() => {
    window.addEventListener('message', e => {
      if (e.data?.type === '__activate_edit_mode')   setTweaksVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
    });
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
  }, []);

  useEffect(() => {
    const panel = document.getElementById('tweaks-results');
    if (panel) panel.classList.toggle('visible', tweaksVisible && page === 'results');
  }, [tweaksVisible, page]);

  function handleSubmit(data) {
    setProfile(data);
    setPage('results');
    window.scrollTo(0, 0);
  }

  function handleDetail(dest) {
    setSelected(dest);
    setPage('detail');
    window.scrollTo(0, 0);
  }

  return (
    <>
      <Nav
        page={page}
        onHome={() => { setPage('home'); window.scrollTo(0,0); }}
        onEdit={()  => { setPage('input'); window.scrollTo(0,0); }}
      />
      {page === 'home'    && <HomePage onStart={() => { setPage('input'); window.scrollTo(0,0); }}/>}
      {page === 'input'   && <InputPage initial={profile} onSubmit={handleSubmit}/>}
      {page === 'results' && profile && <ResultsPage profile={profile} onEdit={() => { setPage('input'); window.scrollTo(0,0); }} onDetail={handleDetail}/>}
      {page === 'detail'  && selected && profile && <DetailPage dest={selected} profile={profile} onBack={() => { setPage('results'); window.scrollTo(0,0); }}/>}
    </>
  );
}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{"cardStyle":"default"}/*EDITMODE-END*/;

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
